                    type: object
                    properties:
                      LocationCashBonusSettings:
                        type: array
                        items: { $ref: "#/components/schemas/LocationCashBonusSetting" }

  # ==========================================================================
  # Diagnostics
  # ==========================================================================

  /TPI_UpdateDeviceVersion:
    post:
      tags: [Diagnostics]
      operationId: TPI_UpdateDeviceVersion
      summary: Register a Transaction Server / reader software version
      description: |
        2022-07 (Axosoft 2049/2051). Verified payload samples from source:
        ```xml
        <DeviceVersion>
          <CorpID>6000</CorpID>
          <MacID>14FEB5C1C377</MacID>
          <LocationID>4</LocationID>
          <IPAddress>192.168.23.2</IPAddress>
          <DeviceType>TransactionServer</DeviceType>
          <WindowsDeviceName>acarroll</WindowsDeviceName>
          <CodeVersion>5.7.1 R119</CodeVersion>
        </DeviceVersion>
        ```
        Reader variant adds `<DeviceTag>` and a `<Reader>` block:
        ReaderBootLoaderVersion, ReaderWifiVersion, ReaderBoardRevVersion,
        ReaderSignalStrength, ReaderChannelNumber, ReaderBootLoaderStatus,
        ReaderCodeOrigin, ReaderConnection (all optional).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, deviceVersionXML]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                deviceVersionXML: { type: string }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerInsertFailedTransaction:
    post:
      tags: [Diagnostics]
      operationId: TransactionServerInsertFailedTransaction
      summary: Log a failed transaction for later analysis/replay
      description: |
        2022-04 (Axosoft 525). Verified payload sample:
        ```xml
        <FailedTransaction>
          <Method>TestMethod</Method>
          <FileName>c4f21d41-c8dd-4703-b845-a450dcc26edc</FileName>
          <Data>...free text dump of the failed call...</Data>
          <LocalDateTime>2022-04-22 16:52:16</LocalDateTime>
          <UTCDateTime>2022-04-22 21:52:16</UTCDateTime>
          <CorpID>6000</CorpID>
          <LocationID>4</LocationID>
          <MACAddress>14FEB5C1C377</MACAddress>
          <DeviceTag>4346</DeviceTag>
          <AccountNumber>128189</AccountNumber>
        </FailedTransaction>
        ```
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, failedTransactionXML]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                failedTransactionXML: { type: string }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerCloseAllExpiredSweepstakes:
    post:
      tags: [Diagnostics]
      operationId: TransactionServerCloseAllExpiredSweepstakes
      summary: Close all expired sweepstakes (housekeeping)
      description: 2020-08 (Axosoft 1333).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

components:
  schemas:
    MacIdArray:
      type: array
      items: { type: string, example: "14FEB5C1C377" }
      description: |
        Candidate device MAC addresses — the API's identity/tenant/routing
        key. Server strips ":", "-", spaces, then resolves the first
        registered MAC to the corp's databases. Unknown MACs → -2/exception.

    AccountNumber:
      type: integer
      format: int64
      description: |
        Card/account number (C# long / SQL bigint). In JavaScript clients
        handle as a STRING end-to-end — may exceed Number.MAX_SAFE_INTEGER
        (same hazard class as BMI personId; see tasks/lessons.md).
      example: 128189

    Money:
      type: number
      format: double
      description: |
        C# decimal. Send invariant-culture format ("12.50") — locale-
        sensitive parsing caused the 2025-01 negative-balance incidents.

    TimeDateMap:
      type: object
      description: |
        ClassLibrary_Accounts.iTimeDate.TimeDateMap. CONFIRMED against the live
        WSDL (2026-07-15): the serialized element is a struct of integer parts,
        NOT a single dateTime. Send all seven fields. Verified working on a live
        TPICreditAccounts call.
      required: [Year, Month, Day, Hour, Minute, Second, Millisecond]
      properties:
        Year: { type: integer }
        Month: { type: integer }
        Day: { type: integer }
        Hour: { type: integer }
        Minute: { type: integer }
        Second: { type: integer }
        Millisecond: { type: integer }

    ReasonCodeTables:
      type: object
      description: |
        Live reason codes pulled from TPI_GetReasonCodeList (corp 6283, 2026-07-15).
        Refund: 1 Returned Merchandise, 2 Bad Service, 3 Unhappy customer,
        5 Damaged goods, 6 Other.
        Comp: 1 Bad Service, 2 Good Customer, 3 Employee, 4 Relative, 5 friend, 6 Other.
        Lock: 1 Locked Account, 2 Expired, 3 Not Active, 4 Employee Card, 5 Disabled.
        Transfer: 0 NONE, 1001 default, 1003 Damaged Card.

    ReturnCode:
      type: integer
      description: "0 = success; -1 = server exception (details in server log only); -2 = MAC_ID not resolved. Duplicate tpiTransactionID → 0 (idempotent no-op)."

    TpiTransactionContext:
      type: object
      description: |
        Standard context block on transactional operations. `tpiTransactionID`
        is the idempotency key (ST_IsThirdPartyPOS_TransProcessed); a repeat
        id returns 0 without re-applying. LocationID may appear as
        `LocID`/`LocationID`/`locationID` per method — same meaning.
      properties:
        LocationID: { type: integer }
        tpiSessionID: { type: string, maxLength: 50 }
        tpiTransactionID:
          { type: string, maxLength: 50, description: Caller-unique id — the idempotency key. }
        tpiEmployeeID: { type: string, maxLength: 50 }
        tpiEmployeeFirstName: { type: string, maxLength: 50 }
        tpiEmployeeLastName: { type: string, maxLength: 50 }
        LT_DateTime: { $ref: "#/components/schemas/TimeDateMap" }
        UTC_DateTime:
          allOf: [{ $ref: "#/components/schemas/TimeDateMap" }]
          description: Some methods name this GMT_DateTime — same meaning.

    AuthEmployee:
      type: object
      description: Authorizing (supervisor) employee on refunds/voids, distinct from the operating tpiEmployee.
      properties:
        AuthEmployeeID: { type: string }
        AuthEmployeeFirstName: { type: string }
        AuthEmployeeLastName: { type: string }

    ReasonCodes:
      type: object
      properties:
        LockReasonCodeList:
          type: array
          items: { $ref: "#/components/schemas/ReasonCode" }
        CompReasonCodeList:
          type: array
          items: { $ref: "#/components/schemas/ReasonCode" }
        TransferReasonCodeList:
          type: array
          items: { $ref: "#/components/schemas/ReasonCode" }
        RefundReasonCodeList:
          type: array
          items: { $ref: "#/components/schemas/ReasonCode" }

    ReasonCode:
      type: object
      properties:
        ReasonCodeID: { type: integer }
        Description: { type: string }
        Order: { type: integer }

    ThirdPartyMacList:
      type: object
      properties:
        ThirdParyMACs:
          type: array
          description: (Field name misspelled in the vendor class — "ThirdParyMACs".)
          items:
            type: object
            properties:
              MAC: { type: string }
              DeviceTag: { type: integer }

    CreditAccount:
      type: object
      description: One account's credit line in TPI_CreditAccounts.
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        Cash: { $ref: "#/components/schemas/Money" }
        CashBonus: { $ref: "#/components/schemas/Money" }
        Token: { type: integer }
        TokenBonus: { type: integer }
        Points: { type: integer }
        TP_Duration: { type: integer, description: Time-play minutes }
        BlockedAccessID: { type: integer }

    DebitAccount:
      type: object
      description: One account's debit line in TPI_PayWithAccountsDebit (cash only).
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        DebitCash: { $ref: "#/components/schemas/Money" }

    DebitAccountCashAndCashBonus:
      type: object
      description: One account's debit line in TPI_DebitUsingAccountCashAndCashBonus.
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        DebitCash: { $ref: "#/components/schemas/Money" }
        DebitCashBonus: { $ref: "#/components/schemas/Money" }

    VoidedCard:
      type: object
      description: Per-card restoration amounts in TPI_VoidTransaction.
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        CreditedCash: { $ref: "#/components/schemas/Money" }
        CreditedBonusCash: { $ref: "#/components/schemas/Money" }
        CreditedTokens: { type: integer }
        CreditedTokenBonus: { type: integer }
        CreditedPoints: { type: integer }
        CreditedDuration: { type: integer }

    LinkedProducts:
      type: object
      description: Redemption/entitlement product linked to a card.
      properties:
        ProductTag: { type: integer }
        QtyToPayout: { type: integer }

    LinkedGateAccess:
      type: object
      description: Gen-1 gate access grant — device tag + actuation count.
      properties:
        DeviceTag: { type: integer, format: int64 }
        Actuations: { type: integer }

    LinkedGateAccess_AA:
      type: object
      description: Gen-2 gate access grant — profile-aware, multiple device tags.
      properties:
        GateAccessID: { type: integer }
        Account: { $ref: "#/components/schemas/AccountNumber" }
        ProductTag: { type: integer }
        DeviceTag:
          type: array
          items: { type: integer, format: int64 }
        Actuations: { type: integer }
        LocID: { type: integer }

    LinkedGateAccess_BB:
      allOf:
        - $ref: "#/components/schemas/LinkedGateAccess_AA"
        - type: object
          description: Gen-3 — adds the validity window.
          properties:
            StartDate: { type: string, format: date-time }
            Expire: { type: string, format: date-time }

    LinkedGateAccessXML:
      type: string
      description: |
        XML string used by TPI_BulkEncodeAccounts_BB (linkedGateAccessXML)
        and TPI_PackageSale_CC/_DD (gateAccessXML). Produced by the Java TS
        (SystemUtilities.LinkedGateAccessItemsToXML). Verified format from
        source comments:
        ```xml
        <LinkedGateAccess>
          <GateAccessItems>
            <GateAccess>
              <Product_Tag>5472</Product_Tag>
              <DeviceTags>
                <DeviceTag>4346</DeviceTag>
                <DeviceTag>4353</DeviceTag>
              </DeviceTags>
              <PackageClusterID>43762918</PackageClusterID>
              <Actuations>3</Actuations>
              <StartTime>2021-04-09 14:38:00</StartTime>
              <Duration>0</Duration>
              <Expire>2021-05-31 23:59:59</Expire>
              <IsFirstSwipe>true</IsFirstSwipe>
              <HasGAProfile>false</HasGAProfile>
              <ExtendExpireMinutes>0</ExtendExpireMinutes>
              <ExtendExpireHours>0</ExtendExpireHours>
              <ExtendExpireDays>0</ExtendExpireDays>
              <ProfileExpire></ProfileExpire>
            </GateAccess>
          </GateAccessItems>
        </LinkedGateAccess>
        ```
        `IsFirstSwipe` = activate window on first swipe; when
        `HasGAProfile` is true, `ProfileExpire` carries the profile's
        expiry. Dates are "yyyy-MM-dd HH:mm:ss".

    GateAccessSale:
      type: object
      description: One account's gate-access sale (gen 1) — balance credits + GA grants.
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        Cash: { $ref: "#/components/schemas/Money" }
        CashBonus: { $ref: "#/components/schemas/Money" }
        Token: { type: integer }
        TokenBonus: { type: integer }
        Points: { type: integer }
        TP_Duration: { type: integer }
        BlockedAccessID: { type: integer }
        MembershipID: { type: integer }
        PackageClusterID: { type: integer, format: int64 }
        GateAccessList:
          type: array
          items: { $ref: "#/components/schemas/LinkedGateAccess_AA" }

    GateAccessSale_BB:
      type: object
      description: One account's gate-access sale (current) — GA items carry StartDate/Expire.
      properties:
        AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
        Cash: { $ref: "#/components/schemas/Money" }
        CashBonus: { $ref: "#/components/schemas/Money" }
        Token: { type: integer }
        TokenBonus: { type: integer }
        Points: { type: integer }
        TP_Duration: { type: integer }
        BlockedAccessID: { type: integer }
        MembershipID: { type: integer }
        PackageClusterID: { type: integer, format: int64 }
        GateAccessList:
          type: array
          items: { $ref: "#/components/schemas/LinkedGateAccess_BB" }

    PackageSaleCore:
      type: object
      description: Parameters shared by every TPI_PackageSale generation.
      required: [MAC_ID, Account, PackageID]
      properties:
        MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
        Account: { $ref: "#/components/schemas/AccountNumber" }
        PackageID: { type: integer }
        ProductTag: { type: integer }
        PackageCost: { $ref: "#/components/schemas/Money" }
        CreditCash: { $ref: "#/components/schemas/Money" }
        CreditBonus: { $ref: "#/components/schemas/Money" }
        CreditTokens: { type: integer }
        CreditTokenBonus: { type: integer }
        CreditPoints: { type: integer }
        TP_Duration: { type: integer }
        BlockedAccessID: { type: integer }
        Products:
          type: array
          items: { $ref: "#/components/schemas/LinkedProducts" }

    PackageSaleContents:
      type: object
      description: Package contents restated on void operations.
      required: [MAC_ID, Account, PackageID]
      properties:
        MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
        Account: { $ref: "#/components/schemas/AccountNumber" }
        PackageID: { type: integer }
        BlockedAccessID: { type: integer }
        ProductTag: { type: integer }
        CreditCash: { $ref: "#/components/schemas/Money" }
        CreditBonus: { $ref: "#/components/schemas/Money" }
        CreditTokens: { type: integer }
        CreditTokenBonus: { type: integer }
        CreditPoints: { type: integer }
        TP_Duration: { type: integer }
        Products:
          type: array
          items: { $ref: "#/components/schemas/LinkedProducts" }

    BulkEncodeCore:
      type: object
      description: |
        Parameters shared by every TPI_BulkEncodeAccounts generation. One
        encode header is created (ST_TPI_Encode_Insert), then each account is
        attached with the same package contents. Explicit account list only —
        no range input.
      required: [MAC_ID, Accounts]
      properties:
        MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
        Accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountNumber" }
        EncodeDescription: { type: string }
        TenderAmount: { $ref: "#/components/schemas/Money" }
        CreditCash: { $ref: "#/components/schemas/Money" }
        CreditBonus: { $ref: "#/components/schemas/Money" }
        CreditTokens: { type: integer }
        CreditTokenBonus: { type: integer }
        CreditPoints: { type: integer }
        TP_Duration: { type: integer }
        Products:
          type: array
          items: { $ref: "#/components/schemas/LinkedProducts" }
        ActivationDate: { $ref: "#/components/schemas/TimeDateMap" }
        ExpirationDate: { $ref: "#/components/schemas/TimeDateMap" }
        BlockedAccessID: { type: integer }

    LocationDevice:
      type: object
      properties:
        DeviceTag: { type: integer, format: int64 }
        DeviceName: { type: string }
        DeviceMacID: { type: string }
        DeviceType: { type: integer }

    LocationDevice_AA:
      allOf:
        - $ref: "#/components/schemas/LocationDevice"
        - type: object
          properties:
            DeviceIP: { type: string }

    LocationDevice_BB:
      allOf:
        - $ref: "#/components/schemas/LocationDevice_AA"
        - type: object
          properties:
            LocationID: { type: integer }
            LocationDescription: { type: string }

    LocationDevice_CC:
      allOf:
        - $ref: "#/components/schemas/LocationDevice_BB"
        - type: object
          properties:
            ResetConfiguration:
              {
                type: boolean,
                description: Reader should reload config / current price level (Axosoft 3101).,
              }

    Location:
      type: object
      properties:
        LocationCode: { type: integer }
        LocationDescription: { type: string }

    LocationEmployee:
      type: object
      properties:
        EmployeeID: { type: integer }
        FirstName: { type: string }
        LastName: { type: string }
        EmployeeCardNumber: { type: integer, format: int64 }
        IsRedemptionGameAuthorized: { type: boolean, description: Axosoft 1096 }
        CanAuthorizeMidwayGamePlay: { type: boolean, description: Axosoft 1085 }
        AuthorizedLocations:
          type: array
          items: { $ref: "#/components/schemas/Location" }

    LocationCashBonusSetting:
      type: object
      description: One cash→bonus reward tier.
      properties:
        BonusID: { type: integer }
        CashValue: { $ref: "#/components/schemas/Money" }
        BonusReward: { $ref: "#/components/schemas/Money" }

  responses:
    IntResult:
      description: |
        Integer return code inside the SOAP response
        (`<OperationName>Result`). 0 = success; -1 = server exception;
        -2 = MAC_ID not resolved. Duplicate tpiTransactionID → 0 without
        re-applying.
      content:
        text/xml:
          schema:
            $ref: "#/components/schemas/ReturnCode"
