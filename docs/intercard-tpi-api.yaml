openapi: 3.0.3

# ============================================================================
# Intercard Transaction Server — WS_ThirdPartyInterface (TPI)
# ============================================================================
# PROVENANCE
# Reverse-engineered 2026-07-15 from the full source of
# WS_ThirdPartyInterface.asmx.cs (legacy .NET Framework ASMX web service,
# vendor: Intercard; version lineage v1.0.1 (2014) → 5.4.x / 6.0.x (2025)).
# All 47 operation names and parameter lists below are read directly from the
# [WebMethod] signatures — they are exact. Data-structure schemas are read
# from the Serializable classes in the same file. Only these remain opaque
# (defined in external vendor libraries, marked x-external-type):
#   - ClassLibrary_Accounts.iTimeDate.TimeDateMap  (used property: whatIsDateTime)
#   - ClassLibrary_Accounts.ConsolidateAccount
#   - TransactionServerNotify / TransactionServerNotify_BB  (typed DataSets
#     filled from ST_TransactionServerNotify[_AA|_BB])
#
# TRANSPORT — THIS IS SOAP, NOT REST
# The service is an ASMX endpoint: POST a SOAP 1.1/1.2 envelope to
# .../WS_ThirdPartyInterface.asmx with SOAPAction "http://tempuri.org/<Operation>"
# (confirm namespace via ?WSDL). Because nearly every operation takes arrays
# and complex objects, the ASMX form-POST binding is NOT usable — SOAP only.
# This OpenAPI file is therefore a *readable catalog*: each path is one SOAP
# operation, the request schema describes the operation's parameters (as they
# appear inside the SOAP body), and the response schema describes the return
# value plus any `out` parameters. Generate real client stubs from the WSDL.
#
# AUTH / TENANCY MODEL
# There is no credential auth. EVERY operation takes `MAC_ID: string[]` — a
# list of candidate device MAC addresses. The server strips ":", "-" and
# spaces, then resolves each MAC against its registration database
# (FEC_GeneralLibs.Security) to find the calling corp's connection strings
# (DebitCard_Data, Merchandise, CustomerInfo, SEC databases) and CorpID.
# First MAC that resolves wins. Unknown MAC → return -2 (or an exception).
# So the MAC array is simultaneously identity, tenant selector, and routing.
# Never expose this endpoint beyond the vendor VPN/LAN.
#
# RETURN CODE CONVENTION (observed consistently in source)
#    0  success
#   -1  exception during processing (details only in server log)
#   -2  MAC_ID not found / could not resolve tenant database
# Some newer methods (TPI_BulkEncodeAccounts_BB, TPI_PackageSale_CC/_DD)
# instead THROW on failure → SOAP fault / HTTP 500. _CC/_DD return void:
# no fault = success.
#
# IDEMPOTENCY
# Transactional operations pass tpiTransactionID; the server calls
# ST_IsThirdPartyPOS_TransProcessed inside the SQL transaction and, if the
# id was already processed, returns 0 WITHOUT re-applying — a duplicate
# retry looks identical to a success. Caveat: Az 11906–11909 (2025-03) fixed
# cases where this check "did not roll back as expected"; on ambiguous
# failures re-query account state rather than blind-retrying money moves.
#
# OTHER INTEGRATION WARNINGS (from vendor changelog in the source header)
#   * ETPI bulk operations are queue-processed downstream — a 0 return means
#     accepted, not that every card encoded. Verify card state after.
#   * Money values were historically parsed with locale-sensitive CultureInfo
#     (negative-balance bug, fixed 2025-01). Send invariant "12.50" decimals.
#   * Account numbers are SQL bigint. In JavaScript treat them as strings
#     end-to-end (same hazard class as BMI personId — tasks/lessons.md).
#   * TPI_PayWithAccountsDebit and TPI_DebitUsingAccountCashAndCashBonus
#     fire an outbound low-balance webhook (Main Event endpoint, AXF1459)
#     when a debit drops an account below the configured minimum.
# ============================================================================

info:
  title: Intercard Transaction Server — Third Party Interface (WS_ThirdPartyInterface)
  version: "6.0.1"
  description: |
    Third-party POS / kiosk / enterprise (ETPI) integration surface for the
    Intercard debit-card ("game card") system, plus the endpoints the on-prem
    Transaction Server itself consumes (device/employee listings and the
    cache-coherency notification queue).

    **Value model** — an account carries: Cash, Bonus Cash (CashBonus),
    Tokens, Bonus Tokens, Points, escrow Points, time-play Duration
    (TP_Duration, minutes), an Activation/Expiration window, a
    BlockedAccessID, optional MembershipID, Linked Products (redemption
    entitlements by ProductTag), and Gate Access entitlements (device-tag
    lists + actuations + time windows, optionally governed by a Gate Access
    Profile).

    **Method suffixes** — `_AA`/`_BB`/`_CC`/`_DD` are successive revisions of
    the same operation kept so fielded readers/POS keep working. Integrate
    against the highest suffix unless noted.

    **TimeDateMap** — all LT_DateTime / GMT_DateTime / UTC_DateTime /
    ActivationDate / ExpirationDate parameters are
    `ClassLibrary_Accounts.iTimeDate.TimeDateMap` objects (external vendor
    type; the service reads its `whatIsDateTime` DateTime). Callers always
    send BOTH location-local (LT) and UTC/GMT wall-clock times.

servers:
  - url: "{scheme}://{host}/WS_ThirdPartyInterface/WS_ThirdPartyInterface.asmx"
    description: Data-center hosted ASMX endpoint (path may vary per install)
    variables:
      scheme: { default: https, enum: [http, https] }
      host: { default: transaction-server.example }

tags:
  - name: Reference Data
    description: Reason-code lists, POS MAC listings.
  - name: Account Lifecycle
    description: Clear, lock, transfer, consolidate, split accounts; dates, membership, entitlements, time-play.
  - name: Money Movement
    description: Credits, comps, debits/payments, refunds, escrow points, voids.
  - name: Sales & Encoding
    description: Package sales (five generations), bulk encoding (three generations).
  - name: Gate Access
    description: Gate access (timed admission) sale, removal, ETPI variant.
  - name: Customer
    description: Customer registration tied to a card.
  - name: TS Notifications
    description: Poll/ack queue in DC_TransactionServerNotify — how the data center keeps each location's Transaction Server balance cache coherent.
  - name: TS Listings
    description: Device, location, employee and bonus-setting listings consumed by the on-prem Transaction Server.
  - name: Diagnostics
    description: Device version registration, failed-transaction logging, sweepstakes housekeeping.

paths:
  # ==========================================================================
  # Reference Data
  # ==========================================================================

  /TPI_GetReasonCodeList:
    post:
      tags: [Reference Data]
      operationId: TPI_GetReasonCodeList
      summary: Retrieve lock / comp / transfer / refund reason-code lists
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200":
          description: Return code + reason code lists
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  reasonCodes: { $ref: "#/components/schemas/ReasonCodes" }

  /TPI_POSMACForLocation:
    post:
      tags: [Reference Data]
      operationId: TPI_POSMACForLocation
      summary: List MAC ids + device tags of all POSs at a location
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, locationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                locationID: { type: integer }
      responses:
        "200":
          description: Return code + MAC list
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  thirdPartyMAC: { $ref: "#/components/schemas/ThirdPartyMacList" }

  # ==========================================================================
  # Account Lifecycle
  # ==========================================================================

  /TPI_ClearAccount:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_ClearAccount
      summary: Remove accounts from the system so the cards can be re-issued
      description: Batch — takes an array of account numbers. No session/transaction id (not idempotency-guarded).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, Account, LocID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                Account:
                  type: array
                  items: { $ref: "#/components/schemas/AccountNumber" }
                LT_DateTime: { $ref: "#/components/schemas/TimeDateMap" }
                GMT_DateTime: { $ref: "#/components/schemas/TimeDateMap" }
                LocID: { type: integer }
                tpiEmployeeID: { type: string }
                tpiEmployeeFirstName: { type: string }
                tpiEmployeeLastName: { type: string }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_LockAccount:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_LockAccount
      summary: Lock an account with a reason code
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, Account, ReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    Account: { $ref: "#/components/schemas/AccountNumber" }
                    ReasonCode:
                      {
                        type: integer,
                        description: From LockReasonCodeList (TPI_GetReasonCodeList),
                      }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_PauseTimePlay:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_PauseTimePlay
      summary: Pause time-play on an account
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, Account, Duration]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    Account: { $ref: "#/components/schemas/AccountNumber" }
                    Duration: { type: integer, description: Pause duration (minutes) }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_ConsolidateAccounts:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_ConsolidateAccounts
      summary: Consolidate all value from source accounts onto a target account
      description: Batch — many source accounts into one target.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, sourceAccounts, targetAccount]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    sourceAccounts:
                      type: array
                      items: { $ref: "#/components/schemas/AccountNumber" }
                    targetAccount: { $ref: "#/components/schemas/AccountNumber" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_ConsolidateAccounts_AA:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_ConsolidateAccounts_AA
      summary: Consolidate with explicit source balance data (current)
      description: |
        2016-10 (Axosoft 268). Replaces the source-account array with a
        `ConsolidateAccount` object (external vendor type — see WSDL for its
        fields; carries the balances being moved).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, targetAccount, sourceBalanceData]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    targetAccount: { $ref: "#/components/schemas/AccountNumber" }
                    sourceBalanceData:
                      type: object
                      description: ClassLibrary_Accounts.ConsolidateAccount (x-external-type — fields not in this source file; see WSDL)
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_CardTransfer:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_CardTransfer
      summary: Transfer balance + history to a new account (original)
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, SourceAccount, TargetAccount, ReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    SourceAccount: { $ref: "#/components/schemas/AccountNumber" }
                    TargetAccount: { $ref: "#/components/schemas/AccountNumber" }
                    ReasonCode: { type: integer, description: From TransferReasonCodeList }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_CardTransfer_AA:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_CardTransfer_AA
      summary: Transfer with explicit balances (current)
      description: 2018-03 (Axosoft 439). Adds the balance amounts being transferred.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, SourceAccount, TargetAccount, ReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    SourceAccount: { $ref: "#/components/schemas/AccountNumber" }
                    TargetAccount: { $ref: "#/components/schemas/AccountNumber" }
                    ReasonCode: { type: integer }
                    cash: { $ref: "#/components/schemas/Money" }
                    bonusCash: { $ref: "#/components/schemas/Money" }
                    tokens: { type: integer }
                    tokenBonus: { type: integer }
                    points: { type: integer }
                    duration: { type: integer }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_SplitCards:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_SplitCards
      summary: Split value from one card onto other cards
      description: Debit amounts leave the source; credit amounts land on EACH target.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, sourceAccount, targetAccounts]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    sourceAccount: { $ref: "#/components/schemas/AccountNumber" }
                    targetAccounts:
                      type: array
                      items: { $ref: "#/components/schemas/AccountNumber" }
                    debitCash: { $ref: "#/components/schemas/Money" }
                    debitBonus: { $ref: "#/components/schemas/Money" }
                    debitTokens: { type: integer }
                    debitTokenBonus: { type: integer }
                    debitPoints: { type: integer }
                    creditCash: { $ref: "#/components/schemas/Money" }
                    creditBonus: { $ref: "#/components/schemas/Money" }
                    creditTokens: { type: integer }
                    creditTokenBonus: { type: integer }
                    creditPoints: { type: integer }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_UpdateAccountActivationExpirationDates:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_UpdateAccountActivationExpirationDates
      summary: Update an account's activation/expiration window
      description: 2016-08 (SB-5, Feature 219). Kept separate from balance updates for backward compatibility.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, accountNumber]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                accountNumber: { $ref: "#/components/schemas/AccountNumber" }
                ActivationDate: { $ref: "#/components/schemas/TimeDateMap" }
                ExpirationDate: { $ref: "#/components/schemas/TimeDateMap" }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_UpdateAccountMembership:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_UpdateAccountMembership
      summary: Update the membership on an account
      description: 2017-11 (SB-12, Feature 297). Wraps ST_TPI_UpdateMembership / ST_DC_ClearMembership.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, accountNumber, membershipID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                accountNumber: { $ref: "#/components/schemas/AccountNumber" }
                membershipID: { type: integer }
                locationID: { type: integer }
                deviceTag: { type: integer, format: int64 }
                gmtDateMap: { $ref: "#/components/schemas/TimeDateMap" }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_EntitlementPaidOut:
    post:
      tags: [Account Lifecycle]
      operationId: TPI_EntitlementPaidOut
      summary: Mark a linked-product entitlement as paid out
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, accountNumber, productTag, paidOut, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                accountNumber: { $ref: "#/components/schemas/AccountNumber" }
                productTag: { type: integer }
                paidOut: { type: integer, description: Quantity paid out }
                LocationID: { type: integer }
                LT_DateTime: { $ref: "#/components/schemas/TimeDateMap" }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  # ==========================================================================
  # Money Movement
  # ==========================================================================

  /TPI_CompAccount:
    post:
      tags: [Money Movement]
      operationId: TPI_CompAccount
      summary: Comp cash / bonus / tokens / points onto an account
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, Account, ReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    Account: { $ref: "#/components/schemas/AccountNumber" }
                    CashComped: { $ref: "#/components/schemas/Money" }
                    BonusComped: { $ref: "#/components/schemas/Money" }
                    TokensComped: { type: integer }
                    TokenBonusComped: { type: integer }
                    PointsComped: { type: integer }
                    ReasonCode: { type: integer, description: From CompReasonCodeList }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPICreditAccounts:
    post:
      tags: [Money Movement]
      operationId: TPICreditAccounts
      summary: Credit balances onto accounts via XML payload (current ETPI recharge path)
      description: |
        2022-08 (Axosoft 2607); since 2023-02 (Axosoft 3063, double-bonus fix)
        wraps ST_ETPI_UpdateBalance. Whole batch runs in one SQL transaction;
        also writes a POS transaction total (ST_TPI_UpdatePOSTransaction,
        TransactionType 1 = Credit). Note: no underscore in the name.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, creditAccountsXML]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    creditAccountsXML:
                      type: string
                      description: |
                        XML string. Verified sample from source:
                        ```xml
                        <CreditAccounts>
                          <CreditAccount>
                            <AccountNumber>1234567</AccountNumber>
                            <Cash>10</Cash>
                            <BonusCash>0</BonusCash>
                            <Tokens>5</Tokens>
                            <BonusTokens>10</BonusTokens>
                            <Points>45</Points>
                            <StartTime>2022-08-01 12:55:26</StartTime>
                            <Duration>30</Duration>
                            <EndTime>2022-08-01 13:25:26</EndTime>
                            <BlockedAccessID>0</BlockedAccessID>
                          </CreditAccount>
                        </CreditAccounts>
                        ```
                        Dates are "yyyy-MM-dd HH:mm:ss".
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_CreditAccounts:
    post:
      tags: [Money Movement]
      operationId: TPI_CreditAccounts
      summary: Credit balances onto accounts via typed objects
      description: Typed-object sibling of TPICreditAccounts (CreditAccount[] instead of XML).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, creditAccounts]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    creditAccounts:
                      type: array
                      items: { $ref: "#/components/schemas/CreditAccount" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_CreditDebitEscrowPoints:
    post:
      tags: [Money Movement]
      operationId: TPI_CreditDebitEscrowPoints
      summary: Credit or debit points held in escrow
      description: 2015-09 (SB-3). Requires Transaction Server >= 5.5.3_16. Table DC_TPI_CreditDebitEscrow.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, accountNumber, points]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    accountNumber: { $ref: "#/components/schemas/AccountNumber" }
                    points: { type: integer, description: Point delta (sign = direction) }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_PayWithAccountsDebit:
    post:
      tags: [Money Movement]
      operationId: TPI_PayWithAccountsDebit
      summary: Debit account cash as payment tender (batch)
      description: |
        Wraps ST_TPI_DebitCardTransaction. Cash only per account (see
        DebitAccount). Fires the low-balance webhook (AXF1459) when a debit
        drops an account below the configured minimum.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, debitAccounts]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    debitAccounts:
                      type: array
                      items: { $ref: "#/components/schemas/DebitAccount" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_DebitUsingAccountCashAndCashBonus:
    post:
      tags: [Money Movement]
      operationId: TPI_DebitUsingAccountCashAndCashBonus
      summary: Debit cash AND bonus cash as payment tender (batch)
      description: |
        2020-03 (Axosoft 1111/1112); wraps ST_TPI_DebitCashAndCashBonus.
        Caller specifies how much comes from each bucket per account.
        Fires the low-balance webhook (AXF1459).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, debitAccounts]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    debitAccounts:
                      type: array
                      items: { $ref: "#/components/schemas/DebitAccountCashAndCashBonus" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_RefundAccount:
    post:
      tags: [Money Movement]
      operationId: TPI_RefundAccount
      summary: Refund — removes cash and bonus (original)
      deprecated: true
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, RefundAccount, RefundReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    RefundAccount: { $ref: "#/components/schemas/AccountNumber" }
                    RefundCash: { $ref: "#/components/schemas/Money" }
                    RefundBonus: { $ref: "#/components/schemas/Money" }
                    RefundReasonCode: { type: integer, description: From RefundReasonCodeList }
                - $ref: "#/components/schemas/AuthEmployee"
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_RefundAccount_AA:
    post:
      tags: [Money Movement]
      operationId: TPI_RefundAccount_AA
      summary: Refund — also removes tokens, token bonus and duration (current)
      description: 2015-09 (SB-3). Requires Transaction Server >= 5.5.3_16.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, RefundAccount, RefundReasonCode]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    RefundAccount: { $ref: "#/components/schemas/AccountNumber" }
                    RefundCash: { $ref: "#/components/schemas/Money" }
                    RefundBonus: { $ref: "#/components/schemas/Money" }
                    RefundToken: { type: integer }
                    RefundTokenBonus: { type: integer }
                    RefundDuration: { type: integer }
                    RefundReasonCode: { type: integer }
                - $ref: "#/components/schemas/AuthEmployee"
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_VoidTransaction:
    post:
      tags: [Money Movement]
      operationId: TPI_VoidTransaction
      summary: Void a prior third-party transaction, re-crediting the affected cards
      description: |
        `VoidedTP_TransactionID` names the original transaction;
        `voidedCards[]` states exactly what to restore per card.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, VoidedTP_TransactionID, voidedCards]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    VoidedTP_TransactionID: { type: string }
                    voidedCards:
                      type: array
                      items: { $ref: "#/components/schemas/VoidedCard" }
                - $ref: "#/components/schemas/AuthEmployee"
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
