      description: 2017-05 (SB-10). Location resolved from the MAC id.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200":
          description: Return code + bonus tiers
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
