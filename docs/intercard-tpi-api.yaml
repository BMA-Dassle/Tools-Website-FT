                LocationIDs:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Return code + device list (adds ResetConfiguration)
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  locationDeviceListing:
                    type: object
                    properties:
                      LocationDevices:
                        type: array
                        items: { $ref: "#/components/schemas/LocationDevice_CC" }

  /TransactionServerLocationInfoXML:
    post:
      tags: [TS Listings]
      operationId: TransactionServerLocationInfoXML
      summary: Location config info XML (LocationInfoMap.xml) for reader reset / price level
      description: 2023-10 (5.4 build, Axosoft 3101).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, transactionServerLocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                transactionServerLocationID: { type: integer }
      responses:
        "200":
          description: XML document as a string
