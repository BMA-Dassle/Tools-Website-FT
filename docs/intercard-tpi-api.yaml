  # ==========================================================================
  # TS Notifications (cache coherency queue)
  # ==========================================================================

  /TransactionServerNotification:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerNotification
      summary: Poll pending notifications (all locations for the corp)
      description: |
        The data center writes rows to DC_TransactionServerNotify; each
        on-prem Transaction Server polls, processes (typically evicting the
        named accounts from its balance cache), then acks with the matching
        Clear method. Result is a typed DataSet (x-external-type).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200":
          description: Return code + TransactionServerNotify DataSet (table ST_TransactionServerNotify)
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  tsNotify: { type: object, description: Typed DataSet (x-external-type) }

  /TransactionServerNotification_Location:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerNotification_Location
      summary: Poll pending notifications for one location
      description: 2017-08 (SB-11, Feature 320).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                LocationID: { type: integer }
      responses:
        "200":
          description: Return code + TransactionServerNotify DataSet
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  tsNotify: { type: object, description: Typed DataSet (x-external-type) }

  /TransactionServerNotification_Location_BB:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerNotification_Location_BB
      summary: Poll notifications incl. in-cache credit/debit payloads (current)
      description: |
        2018-03 (SB-15, Feature 477). Adds the Data payload so a notification
        can instruct the TS to credit/debit a cached account in place instead
        of just evicting it. Payload value types (DC_Type codes):
        25 crcash, 26 crbonus, 27 crtoken, 28 crbtoken, 29 crpoints,
        30 debcash, 31 debbonus.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                LocationID: { type: integer }
      responses:
        "200":
          description: Return code + TransactionServerNotify_BB DataSet (table ST_TransactionServerNotify_BB)
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  tsNotify: { type: object, description: Typed DataSet (x-external-type) }

  /TransactionServerClearNotification:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerClearNotification
      summary: Ack/clear processed notifications (all locations)
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerClearNotification_Location:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerClearNotification_Location
      summary: Ack/clear notifications for one location
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                LocationID: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerClearNotification_ValueTypeLocation:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerClearNotification_ValueTypeLocation
      summary: Clear notifications matching ValueType + Value + location
      description: 2019-02 (SB-16).
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, ValueType, Value, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                ValueType:
                  {
                    type: integer,
                    format: int64,
                    description: DC_Type code (see 25–31 table on the _BB poll),
                  }
                Value: { type: integer, format: int64 }
                LocationID: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerClearAccountAllOtherTS:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerClearAccountAllOtherTS
      summary: Evict an account from cache at every location EXCEPT the one given
      description: 2018-03 (SB-15). Wraps ST_TS_ClearAccountFromOtherTSCache.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, AccountNumber, LocationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                AccountNumber: { $ref: "#/components/schemas/AccountNumber" }
                LocationID: { type: integer, description: The location NOT to clear }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TransactionServerInsertClearAccountNotification:
    post:
      tags: [TS Notifications]
      operationId: TransactionServerInsertClearAccountNotification
      summary: Insert account-clear notifications for all unrelated locations
      description: 2020-04 (Axosoft 477). Inserts NOTIFY_TYPE_ACCOUNTCLEAR rows for every location not in the exempt list.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, accountNumber, locationIDsToExempt]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                accountNumber: { $ref: "#/components/schemas/AccountNumber" }
                locationIDsToExempt:
                  type: array
                  items: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /GetNotifications:
    post:
      tags: [TS Notifications]
      operationId: GetNotifications
      summary: Get notifications as an XML string (CCL Costa variant)
      description: 2022-01 v1.0.9.31 (CCL Costa). String-returning sibling of the poll methods.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, selectAllNotifications, locationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                selectAllNotifications: { type: boolean }
                locationID: { type: integer }
      responses:
        "200":
          description: Notifications XML string
          content:
            text/xml:
              schema: { type: string }

  /RemoveNotification:
    post:
      tags: [TS Notifications]
      operationId: RemoveNotification
      summary: Remove one notification by valueType + value + timeKey + location
      description: 2022-01 v1.0.9.31 (CCL Costa). Returns void.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, valueType, value, timeKey, locationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                valueType: { type: integer, format: int64 }
                value: { type: integer, format: int64 }
                timeKey: { type: string }
                locationID: { type: integer }
      responses:
        "200":
          description: Void — no fault means removed.

