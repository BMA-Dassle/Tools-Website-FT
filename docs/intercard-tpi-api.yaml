                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
      responses:
        "200":
          description: Return code + locations
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  locationList:
                    type: object
                    properties:
                      Locations:
                        type: array
                        items: { $ref: "#/components/schemas/Location" }

  /TransactionServerEmployeeList:
    post:
      tags: [TS Listings]
      operationId: TransactionServerEmployeeList
      summary: List employee pass cards for a location
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_ID, locationID]
              properties:
                MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                locationID: { type: integer }
      responses:
        "200":
          description: Return code + employees
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  locationEmployeeList:
                    type: object
                    properties:
                      LocationEmployees:
