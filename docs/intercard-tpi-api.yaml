      description: 2019-07 (Axosoft 1096). Note the parameter is `MAC_IDs` (plural) on this and the two methods below.
      requestBody:
        content:
          text/xml:
            schema:
              type: object
              required: [MAC_IDs, locationIDs]
              properties:
                MAC_IDs: { $ref: "#/components/schemas/MacIdArray" }
                locationIDs:
