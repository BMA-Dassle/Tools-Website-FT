              properties:
                MAC_IDs: { $ref: "#/components/schemas/MacIdArray" }
                locationIDs:
                  type: array
                  items: { type: integer }
                cardNumber: { $ref: "#/components/schemas/AccountNumber" }
      responses:
        "200":
          description: Return code + employee
          content:
            text/xml:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/ReturnCode" }
                  locationEmployee: { $ref: "#/components/schemas/LocationEmployee" }

  /TransactionServerLocationEmployeeByID:
    post:
      tags: [TS Listings]
