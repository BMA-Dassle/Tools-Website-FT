                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_GateAccessSale_BB:
    post:
      tags: [Gate Access]
      operationId: TPI_GateAccessSale_BB
      summary: Sell gate access (current typed revision — items carry StartDate/Expire)
      description: 2020-08 (Axosoft 1680/1681). ActiveOnFirstSwipe not required when a GA Profile is present (Az 4035).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, gateAccessSaleList]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    gateAccessSaleList:
                      type: object
                      properties:
                        GateAccessSaleItems:
                          type: array
                          items: { $ref: "#/components/schemas/GateAccessSale_BB" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /ETPI_GateAccessSale:
    post:
      tags: [Gate Access]
      operationId: ETPI_GateAccessSale
      summary: Gate access sale via the enterprise (ETPI) path — XML payload
      description: |
        2021-06 (Axosoft 1449). Payload root is `<TPIGateAccessSale>`
        containing `<SaleItem>` elements; each SaleItem carries the account,
        balance credits (Cash/BonusCash/Tokens/BonusTokens/Points),
        BlockedAccessID, MembershipID, and one or more `<GateAccess>` blocks
        in the LinkedGateAccess XML format (Product_Tag, DeviceTags/DeviceTag*,
        PackageClusterID, Actuations, StartTime, Duration, Expire,
        HasGAProfile, ExtendExpire{Minutes,Hours,Days}, ProfileExpire).
        Queue-processed — verify downstream.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, ETPIGateAccessSaleXML]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    ETPIGateAccessSaleXML:
                      {
                        type: string,
                        description: See operation description for the verified format.,
                      }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_GateAccessRemove:
    post:
      tags: [Gate Access]
      operationId: TPI_GateAccessRemove
      summary: Remove a gate access entitlement (and back out its credits)
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - type: object
                  required: [MAC_ID, Account, GateAccessID]
                  properties:
                    MAC_ID: { $ref: "#/components/schemas/MacIdArray" }
                    Account: { $ref: "#/components/schemas/AccountNumber" }
                    GateAccessID: { type: integer }
                    BlockedAccessID: { type: integer }
                    ProductTag: { type: integer }
                    CreditCash: { $ref: "#/components/schemas/Money" }
                    CreditBonus: { $ref: "#/components/schemas/Money" }
                    CreditTokens: { type: integer }
                    CreditTokenBonus: { type: integer }
                    CreditPoints: { type: integer }
                    TP_Duration: { type: integer }
                    GateAccess: { $ref: "#/components/schemas/LinkedGateAccess_AA" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

