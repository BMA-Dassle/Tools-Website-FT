                - type: object
                  properties:
                    GateAccess:
                      type: array
                      items: { $ref: "#/components/schemas/LinkedGateAccess_AA" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_PackageSale_BB:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_PackageSale_BB
      summary: Sell a package (gen 3 — LinkedGateAccess_BB adds StartDate/Expire)
      deprecated: true
      description: |
        2020-08 (Axosoft 1680/1681). KNOWN BUG fixed in _CC (Az 8478): gate
        access StartTime/Expire assignment was wrong here. Prefer _CC/_DD.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/PackageSaleCore"
                - type: object
                  properties:
                    gateAccess:
                      type: array
                      items: { $ref: "#/components/schemas/LinkedGateAccess_BB" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_PackageSale_CC:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_PackageSale_CC
      summary: Sell a package (gen 4 — gate access as XML string; returns void)
      description: |
        2024-06 (Az 8478): fixes _BB's GA StartTime/Expire assignment and the
        "deleted gate passes/readers → Account Not Active / won't populate in
        TS cache" failure. RETURNS VOID — success is the absence of a SOAP
        fault. `gateAccessXML` uses the LinkedGateAccess XML format (see
        components/schemas/LinkedGateAccessXML).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/PackageSaleCore"
                - type: object
                  properties:
                    gateAccessXML: { $ref: "#/components/schemas/LinkedGateAccessXML" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200":
          description: Void — no fault means success. Errors surface as SOAP faults (HTTP 500).

  /TPI_PackageSale_DD:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_PackageSale_DD
      summary: Sell a package (gen 5, current — adds membership promo + discount rate)
      description: |
        Latest generation. Same as _CC plus `membershipPromoID` and
        `discountRate` (membership pricing — cf. Az 13553 membership fixes).
        RETURNS VOID — no fault means success.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/PackageSaleCore"
                - type: object
                  properties:
                    membershipPromoID: { type: integer }
                    discountRate: { type: integer }
                    gateAccessXML: { $ref: "#/components/schemas/LinkedGateAccessXML" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200":
          description: Void — no fault means success. Errors surface as SOAP faults (HTTP 500).

  /TPI_BulkEncodeAccounts:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_BulkEncodeAccounts
      summary: Bulk-encode a package onto many cards (gen 1)
      deprecated: true
      description: |
        KNOWN BUG (Axosoft 2603): applied the wrong Gate Access Profile —
        superseded by _BB. Active/expire date-range bug fixed 2015-06 (SB-2).
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkEncodeCore"
                - type: object
                  properties:
                    GateAccess:
                      type: array
                      items: { $ref: "#/components/schemas/LinkedGateAccess" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_BulkEncodeAccounts_AA:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_BulkEncodeAccounts_AA
      summary: Bulk-encode (gen 2 — LinkedGateAccess_AA)
      deprecated: true
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkEncodeCore"
                - type: object
                  properties:
                    GateAccess:
                      type: array
                      items: { $ref: "#/components/schemas/LinkedGateAccess_AA" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

  /TPI_BulkEncodeAccounts_BB:
    post:
      tags: [Sales & Encoding]
      operationId: TPI_BulkEncodeAccounts_BB
      summary: Bulk-encode (gen 3, current — "ETPI Bulk Encode", gate access as XML)
      description: |
        2022-05 (Axosoft 2603). Gate access moves to `linkedGateAccessXML`
        (see components/schemas/LinkedGateAccessXML) — activation-on-first-
        swipe and GA-Profile behavior are expressed IN the XML
        (IsFirstSwipe / HasGAProfile / ProfileExpire elements), which is how
        the separate ActiveOnFirstSwipe parameter came to be removed
        (Az 11181/11189/11190, 2025-01). Runs the whole batch in one SQL
        transaction with rollback; ON ERROR THIS METHOD THROWS (SOAP fault)
        instead of returning -1; success returns 0. Via ETPI the encode is
        queue-processed downstream — verify card state after submit.
      requestBody:
        content:
          text/xml:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkEncodeCore"
                - type: object
                  properties:
                    linkedGateAccessXML: { $ref: "#/components/schemas/LinkedGateAccessXML" }
                - $ref: "#/components/schemas/TpiTransactionContext"
      responses:
        "200": { $ref: "#/components/responses/IntResult" }

